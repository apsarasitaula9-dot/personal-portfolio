<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <!-- Soft Backlight Radial Glow -->
    <radialGradient id="pinkAmbientGlow" cx="48%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#FFA8BA" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#FF758F" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#FCE4EC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFF5F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Magenta to Rose Main Stroke -->
    <linearGradient id="mainBrushGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#FF5D8F"/>
      <stop offset="30%" stop-color="#E63976"/>
      <stop offset="70%" stop-color="#C2255C"/>
      <stop offset="100%" stop-color="#9C1948"/>
    </linearGradient>

    <!-- Highlight Pastel Stroke -->
    <linearGradient id="highlightBrushGrad" x1="20%" y1="80%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#FFB3C6" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FF758F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D6336C" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="brushFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Rose Aura Circle -->
  <circle cx="380" cy="420" r="320" fill="url(#pinkAmbientGlow)"/>

  <!-- Organic Back Blobs / Paint Smears -->
  <path d="M 220,380 C 170,240 280,160 440,170 C 580,180 640,280 620,410 C 600,550 510,630 380,640 C 260,650 180,560 190,450 Z" fill="#FCE4EC" opacity="0.85"/>

  <!-- Primary Broad Angled Brush Sweep (Bottom-Left to Top-Right) -->
  <path d="M 160,620 C 260,560 340,490 480,340 C 580,230 680,130 750,70 C 730,100 660,180 620,230 C 530,350 400,500 250,620 C 210,645 180,635 160,620 Z" fill="url(#mainBrushGrad)" filter="url(#brushFilter)"/>

  <!-- Layer 2: Texture Swipes with Feathered Bristles -->
  <path d="M 200,590 C 300,520 410,430 550,270 C 640,160 710,95 765,50 C 745,75 675,160 625,235 C 515,380 375,520 250,610 Z" fill="url(#highlightBrushGrad)" opacity="0.9"/>

  <path d="M 270,550 C 370,460 490,340 620,190 C 670,140 710,90 750,55 C 730,85 680,150 630,210 C 530,350 400,480 300,560 Z" fill="#FF4D6D" opacity="0.8"/>

  <!-- Dry Brush Streaks & Bristle Marks -->
  <path d="M 440,330 Q 580,190 690,105" stroke="#FFA8BA" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
  <path d="M 480,300 Q 610,170 720,80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M 380,410 Q 530,240 650,140" stroke="#FF758F" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M 330,460 Q 460,320 580,200" stroke="#E63976" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <path d="M 260,530 Q 380,400 490,290" stroke="#C2255C" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- Expressive Splatters & Droplets -->
  <circle cx="735" cy="140" r="5" fill="#E63976" opacity="0.7"/>
  <circle cx="700" cy="70" r="3.5" fill="#C2255C" opacity="0.6"/>
  <circle cx="660" cy="50" r="6" fill="#FF5D8F" opacity="0.65"/>
  <circle cx="760" cy="90" r="3" fill="#FF85A1" opacity="0.7"/>
  <circle cx="210" cy="650" r="4.5" fill="#FF5D8F" opacity="0.5"/>
  <circle cx="170" cy="540" r="3.5" fill="#C2255C" opacity="0.45"/>
  <circle cx="150" cy="480" r="3" fill="#E63976" opacity="0.4"/>
</svg>